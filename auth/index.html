<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    window.onload = () => {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const token = hashParams.get("access_token");

      if (!token) {
        document.body.innerText = "Error: access_token not found in URL.";
        return;
      }

      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        window.location.href = `clickerapp://auth?access_token=${token}`;
      } else {
        window.location.href = `http://localhost:12345/?access_token=${token}`;
      }
    };
  </script>
</head>
<body>
  Wait, please... Redirecting to the app...
</body>
</html>
