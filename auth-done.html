<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    window.onload = () => {
      const query = new URLSearchParams(window.location.search);
      const code = query.get("code");

      if (!code) {
        document.body.innerText = "Error: parameter code is not found.";
        return;
      }

      // Проверка на Android
      const isAndroid = /Android/i.test(navigator.userAgent);

      // Выбираем схему редиректа в зависимости от платформы
      if (isAndroid) {
        // Unity Android будет перехватывать через intent-filter на myapp://oauth
        window.location.href = `clickerapp://auth?code=${code}`;
      } else {
        // ПК-версия Unity слушает локальный сервер
        window.location.href = `http://localhost:12345/?code=${code}`;
      }
    };
  </script>
</head>
<body>
  Wait, please... Redirecting to the app...
</body>
</html>
